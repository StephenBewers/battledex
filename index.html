<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battleground</title>
  <meta name="description" content="Type in two fighters and an AI decides who would win.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#fighters">Skip to fighter form</a>

  <main class="screen">
    <header class="masthead">
      <h1 class="title">Battle<span class="title-accent">ground</span></h1>
      <p class="tagline">Who would win?</p>
    </header>

    <form id="fight-form" class="panel" novalidate>
      <fieldset id="fighters" class="fighters">
        <legend class="visually-hidden">Choose two fighters</legend>

        <div class="field">
          <label for="fighter-a" class="label">Player 1</label>
          <input id="fighter-a" name="fighterA" class="input" type="text"
                 autocomplete="off" maxlength="60" placeholder="e.g. Grizzly bear">
          <p class="field-error" id="error-a" role="alert"></p>
        </div>

        <div class="vs" aria-hidden="true">VS</div>

        <div class="field">
          <label for="fighter-b" class="label">Player 2</label>
          <input id="fighter-b" name="fighterB" class="input" type="text"
                 autocomplete="off" maxlength="60" placeholder="e.g. 100 ducks">
          <p class="field-error" id="error-b" role="alert"></p>
        </div>
      </fieldset>

      <p id="fight-error" class="fight-error" role="alert" hidden></p>

      <button type="submit" class="fight-button">Fight!</button>
    </form>

    <!-- Only one of the three views (form, loading, result) is visible at a time.
         app.js toggles their `hidden` attributes. -->

    <!-- Loading view. Receives focus when shown, so it is read aloud. -->
    <section id="loading" class="loading" hidden tabindex="-1" aria-label="Fight in progress">
      <p class="loading-text">FIGHT!</p>
      <p class="loading-sub">The judges are deliberating</p>
    </section>

    <!-- Result view: the animated winner's card, then a New fight button.
         The heading receives focus when the card appears. -->
    <section id="result" class="result" hidden aria-labelledby="result-title">
      <article class="winner-card">
        <h2 id="result-title" class="winner-heading" tabindex="-1">
          <span class="winner-banner">Winner!</span>
          <span id="winner-name" class="winner-name"></span>
        </h2>

        <div id="winner-portrait" class="winner-portrait"></div>

        <section class="winner-reasoning" aria-labelledby="reasoning-title">
          <h3 id="reasoning-title" class="reasoning-title">Why they won</h3>
          <p id="result-reasoning" class="reasoning-text"></p>
        </section>

        <aside class="defeated" aria-labelledby="defeated-label">
          <div id="loser-portrait" class="defeated-portrait"></div>
          <div class="defeated-info">
            <p id="defeated-label" class="defeated-label">Defeated</p>
            <p id="loser-name" class="defeated-name"></p>
          </div>
        </aside>
      </article>

      <button type="button" id="new-fight" class="fight-button">New fight</button>
    </section>

    <footer class="footer">
      <p>Insert imagination to continue</p>
    </footer>
  </main>

  <script src="validation.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
</body>
</html>
